name: Oracle

on:
  workflow_dispatch:
  schedule:
    # 10:00 VN - well before the 18:00 draw, so prophecies are committed in advance.
    - cron: '0 3 * * *'
    # 18:45 VN - after the draw, to ingest the result and update the scoreboard.
    - cron: '45 11 * * *'

# Every data step below is idempotent, so running the full sequence at both times is
# safe and simpler than branching on which cron fired:
#   - ingest never rewrites an existing draw
#   - oracle refuses to duplicate a prophecy, or to prophesy a settled draw
#   - score and site are derived purely from draws + prophecies
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oracle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # A gap or upstream lag exits non-zero on purpose. That is a warning about
      # someone else's mirror, not a reason to abandon the run - and `ingest` already
      # tries vietlott.vn as a fallback before reporting a gap as unresolved.
      - name: Ingest results
        run: uv run trungso ingest --check-gaps || true

      - name: Prophesy
        run: uv run trungso oracle

      - name: Score
        run: uv run trungso score

      - name: Build site bundle
        run: uv run trungso site

      - name: Step summary
        run: |
          {
            echo '```'
            uv run trungso today
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        run: |
          git config user.name  "trungso-oracle"
          git config user.email "oracle@trungso.invalid"
          git add data/ site/data.json
          if git diff --staged --quiet; then
            echo "Vu tru khong noi gi moi hom nay."
          else
            git commit -m "oracle: $(date -u +%F) — vũ trụ đã lên tiếng"
            git push
          fi

      # Telegram is a convenience, never a gatekeeper: `|| true` keeps a dead bot or
      # an unset secret from failing a run whose data work already succeeded.
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "45 11 * * *" ]; then
            uv run trungso notify --kind result || true
          else
            uv run trungso notify --kind prophecy || true
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # GitHub Pages is unavailable on a private repo under the free plan, so this job
  # cannot succeed until the repo is public (or the account is on Pro). It is marked
  # continue-on-error so the data pipeline above still reports green in the meantime,
  # and it starts working on its own the moment Pages is enabled - no edit needed.
  deploy-pages:
    needs: run
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
